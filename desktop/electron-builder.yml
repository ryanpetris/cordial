appId: dev.petris.cordial
productName: Cordial
executableName: cordial-desktop
directories:
  output: dist
# The native modules ship N-API prebuilds that load in Electron as they are.
npmRebuild: false
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - assets/icons/*.png
  - package.json
  - "!**/*.map"
  - "!node_modules/@serialport/bindings-cpp/prebuilds/{android,darwin,win32}-*/**"
  - "!node_modules/@serialport/bindings-cpp/prebuilds/linux-!(${arch})/**"
  - "!node_modules/@serialport/bindings-cpp/prebuilds/**/*.musl.node"
artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target: [AppImage, tar.gz, dir]
  syncDesktopName: true
  category: Utility
  icon: assets/icons/app-512.png
  synopsis: Manage Cordial Bluetooth adapters
  description: Tray application for Cordial Bluetooth-to-USB keyboard and mouse adapters.
  desktop:
    entry:
      StartupWMClass: cordial-desktop
      Keywords: bluetooth;keyboard;mouse;battery;
deb:
  packageName: cordial-desktop
  artifactName: cordial-desktop_${version}_amd64.${ext}
  depends:
    - libc6
    - libgcc-s1
    - libstdc++6
    - libgtk-3-0t64
    - libglib2.0-0t64
    - libatk1.0-0t64
    - libatk-bridge2.0-0t64
    - libatspi2.0-0t64
    - libcairo2
    - libpango-1.0-0
    - libgbm1
    - libxkbcommon0
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxrandr2
    - libasound2t64
    - libcups2t64
    - libdbus-1-3
    - libexpat1
    - libnspr4
    - libnss3
    - libnotify4
    - libudev1
    # SerialPort.list() runs udevadm.
    - udev
  recommends: []
  fpm:
    - ../LICENSE=/usr/share/doc/cordial-desktop/copyright
pacman:
  packageName: cordial-desktop
  artifactName: cordial-desktop-${version}-1-x86_64.pkg.tar.xz
  compression: xz
  depends:
    - alsa-lib
    - at-spi2-core
    - cairo
    - dbus
    - expat
    - glib2
    - glibc
    - gtk3
    - hicolor-icon-theme
    - libcups
    - libgcc
    - libnotify
    - libstdc++
    - libx11
    - libxcb
    - libxcomposite
    - libxdamage
    - libxext
    - libxfixes
    - libxkbcommon
    - libxrandr
    - mesa
    - nspr
    - nss
    - pango
    - systemd
    - systemd-libs
  fpm:
    - ../LICENSE=/usr/share/licenses/cordial-desktop/LICENSE
extraFiles:
  - from: ../LICENSE
    to: LICENSE
