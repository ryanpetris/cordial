name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install just
        run: |
          sh docker/install-just.sh "$RUNNER_TEMP/cordial-bin"
          echo "$RUNNER_TEMP/cordial-bin" >> "$GITHUB_PATH"
      - name: Validate release tag
        id: version
        run: |
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=${GITHUB_REF_NAME#v}
          echo "CORDIAL_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Buf
        run: |
          curl --fail --location https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-Linux-x86_64 --output "$RUNNER_TEMP/buf"
          printf '%s  %s\n' fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b "$RUNNER_TEMP/buf" | sha256sum --check
          chmod +x "$RUNNER_TEMP/buf"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check protocol
        run: time just check-protocol
  linux:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install just
        run: |
          sh docker/install-just.sh "$RUNNER_TEMP/cordial-bin"
          echo "$RUNNER_TEMP/cordial-bin" >> "$GITHUB_PATH"
      - name: Build and check portable applications
        run: just package-host-appimage package-host-tar check-appimage-resolute check-appimage-arch
      - name: Check unified host archive
        if: success() || failure()
        run: time python3 tools/check_release_archive.py "build/release/cordial-$CORDIAL_VERSION-linux-amd64.tar.gz" host "$CORDIAL_VERSION"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: appimage-smoke-evidence
          path: |
            build/appimage-smoke-resolute/
            build/appimage-smoke-arch/
          if-no-files-found: warn
      - name: Prepare release archives
        run: |
          mkdir release
          cp build/release/*.AppImage build/release/*.tar.gz release/
          cd release
          sha256sum ./* > SHA256SUMS-linux
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: release/
          compression-level: 0
          if-no-files-found: error
  arch:
    needs: [validate, linux]
    runs-on: ubuntu-24.04
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
      CORDIAL_HOMEPAGE: https://github.com/${{ github.repository }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install just
        run: |
          sh docker/install-just.sh "$RUNNER_TEMP/cordial-bin"
          echo "$RUNNER_TEMP/cordial-bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: packages-linux
          path: build/portable
      - name: Build and check native package
        run: |
          (cd build/portable && sha256sum -c SHA256SUMS-linux)
          just HOST_ARCHIVE="build/portable/cordial-$CORDIAL_VERSION-linux-amd64.tar.gz" check-package-arch
      - uses: actions/upload-artifact@v7
        with:
          name: packages-arch
          path: release/
          compression-level: 0
          if-no-files-found: error
  debian:
    needs: [validate, linux]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: trixie
          - distribution: resolute
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
      CORDIAL_HOMEPAGE: https://github.com/${{ github.repository }}
      DEB_DISTRIBUTION: ${{ matrix.distribution }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install just
        run: |
          sh docker/install-just.sh "$RUNNER_TEMP/cordial-bin"
          echo "$RUNNER_TEMP/cordial-bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        if: matrix.distribution == 'resolute'
        with:
          name: packages-linux
          path: build/portable
      - name: Build and check native Debian package
        if: matrix.distribution == 'trixie'
        run: just DEB_DISTRIBUTION=trixie check-package-deb
      - name: Package and check the Resolute release executable
        if: matrix.distribution == 'resolute'
        run: |
          (cd build/portable && sha256sum -c SHA256SUMS-linux)
          just DEB_DISTRIBUTION=resolute HOST_ARCHIVE="build/portable/cordial-$CORDIAL_VERSION-linux-amd64.tar.gz" check-package-deb
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.distribution }}
          path: release/
          compression-level: 0
          if-no-files-found: error
  firmware:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
    strategy:
      fail-fast: false
      matrix:
        board: [pico_w, pico2_w, pimoroni_pico_plus2_w, waveshare_rp2350b_plus_w, esp32s3]
        profile: [production, debug]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install just
        run: |
          sh docker/install-just.sh "$RUNNER_TEMP/cordial-bin"
          echo "$RUNNER_TEMP/cordial-bin" >> "$GITHUB_PATH"
      - name: Check and build firmware
        run: just BOARD='${{ matrix.board }}' PROFILE='${{ matrix.profile }}' check-and-build-firmware
      - name: Archive complete firmware package
        env:
          BOARD: ${{ matrix.board }}
          VERSION: ${{ needs.validate.outputs.version }}${{ matrix.profile == 'debug' && '-debug' || '' }}
        run: |
          mkdir release
          tar -C build/firmware -czf "release/cordial-firmware-$VERSION-$BOARD.tar.gz" "$VERSION"
          cd release
          sha256sum ./*.tar.gz > "SHA256SUMS-firmware-$VERSION-$BOARD"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-firmware-${{ matrix.board }}-${{ matrix.profile }}
          path: release/
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [validate, linux, arch, debian, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - name: Verify release assets
        working-directory: release
        run: |
          cat SHA256SUMS-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          test -f "cordial-$CORDIAL_VERSION-x86_64.AppImage"
          test -f "cordial-$CORDIAL_VERSION-linux-amd64.tar.gz"
          test -f "cordial-$CORDIAL_VERSION-1-x86_64.pkg.tar.zst"
          for distribution in trixie resolute; do
            test -f "cordial_${CORDIAL_VERSION}-1~${distribution}_amd64.deb"
          done
          for board in pico_w pico2_w pimoroni_pico_plus2_w waveshare_rp2350b_plus_w esp32s3; do
            test -f "cordial-firmware-$CORDIAL_VERSION-$board.tar.gz"
            test -f "cordial-firmware-$CORDIAL_VERSION-debug-$board.tar.gz"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes release/*.AppImage release/*.pkg.tar.zst release/*.deb release/*.tar.gz release/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
