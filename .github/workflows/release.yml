name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        id: version
        run: |
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version=${GITHUB_REF_NAME#v}
          echo "CORDIAL_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git clang libclang-dev pkg-config
      - name: Install Rust check components
        run: |
          cd rust
          rustup component add clippy
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check Rust and desktop
        run: |
          make check-rust check-desktop check-protocol
      - name: Check build tools and board presets
        run: make check-tools
  linux:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build portable applications
        run: make package-desktop package-cli package-web
      - name: Check desktop archive
        run: |
          python3 tools/check_release_archive.py "desktop/dist/cordial-desktop-$CORDIAL_VERSION-x64.tar.gz" desktop "$CORDIAL_VERSION"
      - name: Prepare release archives
        run: |
          mkdir release
          cp desktop/dist/*.AppImage desktop/dist/*.tar.gz build/release/*.tar.gz release/
          tar -C build/packages/web -czf "release/cordial-web-$CORDIAL_VERSION.tar.gz" "cordial-web-$CORDIAL_VERSION"
          cd release
          sha256sum ./* > SHA256SUMS-linux
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: release/
          compression-level: 0
          if-no-files-found: error
  arch:
    needs: [validate, linux]
    runs-on: ubuntu-24.04
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
      CORDIAL_HOMEPAGE: https://github.com/${{ github.repository }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: packages-linux
          path: build/portable
      - name: Build native packages
        run: |
          (cd build/portable && sha256sum -c SHA256SUMS-linux)
          make package-desktop-arch package-cli-arch DESKTOP_ARCHIVE="build/portable/cordial-desktop-$CORDIAL_VERSION-x64.tar.gz" CLI_ARCHIVE="build/portable/cordial-cli-$CORDIAL_VERSION-linux-amd64.tar.gz"
      - name: Check independent installations, reinstall and removal
        run: docker run --rm -v "$PWD:$PWD" -w "$PWD" -e CORDIAL_VERSION archlinux:base-devel packaging/check-arch.sh
      - uses: actions/upload-artifact@v7
        with:
          name: packages-arch
          path: release/
          compression-level: 0
          if-no-files-found: error
  debian:
    needs: [validate, linux]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:13
            distribution: trixie
          - image: ubuntu:24.04
            distribution: noble
          - image: ubuntu:26.04
            distribution: resolute
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
      CORDIAL_HOMEPAGE: https://github.com/${{ github.repository }}
      DEB_DISTRIBUTION: ${{ matrix.distribution }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: packages-linux
          path: build/portable
      - name: Build native packages
        run: |
          (cd build/portable && sha256sum -c SHA256SUMS-linux)
          make package-desktop-deb package-cli-deb DEB_DISTRIBUTION="$DEB_DISTRIBUTION" DESKTOP_ARCHIVE="build/portable/cordial-desktop-$CORDIAL_VERSION-x64.tar.gz" CLI_ARCHIVE="build/portable/cordial-cli-$CORDIAL_VERSION-linux-amd64.tar.gz"
      - name: Check independent installations, reinstall and removal
        run: docker run --rm -v "$PWD:$PWD" -w "$PWD" -e CORDIAL_VERSION -e DEB_DISTRIBUTION '${{ matrix.image }}' packaging/check-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.distribution }}
          path: release/
          compression-level: 0
          if-no-files-found: error
  desktop-smoke:
    needs: [validate, debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: packages-noble
          path: build/native
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop package and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 ./build/native/cordial-desktop_*_amd64.deb
          npm ci --ignore-scripts --no-audit --no-fund --prefix desktop
      - name: Check installed desktop with sandbox enabled
        run: CORDIAL_EXECUTABLE=/opt/cordial-desktop/cordial-desktop xvfb-run -a dbus-run-session -- node desktop/scripts/smoke.mjs desktop/out/package-smoke
  firmware:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.validate.outputs.epoch }}
    strategy:
      fail-fast: false
      matrix:
        board: [pico_w, pico2_w, waveshare_rp2350b_plus_w, xiao_esp32s3]
        profile: [production, development]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check firmware
        run: make check-firmware BOARD='${{ matrix.board }}' PROFILE='${{ matrix.profile }}'
      - name: Build firmware
        run: make package-firmware BOARD='${{ matrix.board }}' PROFILE='${{ matrix.profile }}'
      - name: Archive complete firmware package
        env:
          BOARD: ${{ matrix.board }}
          # Development firmware is published as the debug build.
          SUFFIX: ${{ matrix.profile == 'development' && '-debug' || '' }}
        run: |
          mkdir release
          tar -C "build/firmware/$CORDIAL_VERSION" -czf "release/cordial-firmware-$CORDIAL_VERSION-$BOARD$SUFFIX.tar.gz" .
          cd release
          sha256sum ./*.tar.gz > "SHA256SUMS-firmware-$BOARD$SUFFIX"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-firmware-${{ matrix.board }}-${{ matrix.profile }}
          path: release/
          compression-level: 0
          if-no-files-found: error
  publish:
    needs: [validate, linux, arch, debian, desktop-smoke, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CORDIAL_VERSION: ${{ needs.validate.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: release
      - name: Verify release assets
        working-directory: release
        run: |
          cat SHA256SUMS-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          test -f "cordial-desktop-$CORDIAL_VERSION-x86_64.AppImage"
          test -f "cordial-desktop-$CORDIAL_VERSION-x64.tar.gz"
          test -f "cordial-cli-$CORDIAL_VERSION-linux-amd64.tar.gz"
          test -f "cordial-web-$CORDIAL_VERSION.tar.gz"
          for application in cordial-desktop cordial-cli; do
            test -f "$application-$CORDIAL_VERSION-1-x86_64.pkg.tar.zst"
            for distribution in trixie noble resolute; do
              test -f "${application}_${CORDIAL_VERSION}-1~${distribution}_amd64.deb"
            done
          done
          for board in pico_w pico2_w waveshare_rp2350b_plus_w xiao_esp32s3; do
            test -f "cordial-firmware-$CORDIAL_VERSION-$board.tar.gz"
            test -f "cordial-firmware-$CORDIAL_VERSION-$board-debug.tar.gz"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes release/*.AppImage release/*.pkg.tar.zst release/*.deb release/*.tar.gz release/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
