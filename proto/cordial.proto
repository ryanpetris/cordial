// The Cordial serial API. A client sends one Request per frame and receives one Response for each,
// in order; the Dongle also sends an Event whenever a device, its settings, a profile, the adapter,
// a scan or a pairing changes. Each frame is one logical protobuf message, COBS-encoded and
// followed by a zero byte. Requests fit in 1024 protobuf bytes before COBS encoding. Responses
// and events have no protocol size limit. docs/protocol describes framing, sessions and the
// compatibility rules.
syntax = "proto3";

package cordial;

// ---------------------------------------------------------------------------
// Envelopes
// ---------------------------------------------------------------------------

// Client to Dongle. Exactly one command is set. The complete encoded Request, including its
// command and every list entry, is at most 1024 bytes before COBS encoding. USB write boundaries
// do not affect this limit. A larger request returns ERROR_CODE_TOO_LONG without being executed.
message Request {
  oneof command {
    GetStatus get_status = 1;
    SetAdapter set_adapter = 2;
    EnterBootloader enter_bootloader = 3;

    StartScan start_scan = 4;
    StopScan stop_scan = 5;
    StartPairing start_pairing = 6;
    AcceptPrompt accept_prompt = 7;
    RejectPrompt reject_prompt = 8;
    CancelPairing cancel_pairing = 9;

    ListDevices list_devices = 10;
    GetDevice get_device = 11;
    SetDevice set_device = 12;
    ConnectDevice connect_device = 13;
    DisconnectDevice disconnect_device = 14;
    UnpairDevice unpair_device = 15;
    RefreshDevice refresh_device = 16;

    ListSettings list_settings = 17;
    SetSettings set_settings = 18;

    ListProfiles list_profiles = 19;
    GetProfile get_profile = 20;
    CreateProfile create_profile = 21;
    CopyProfile copy_profile = 22;
    DeleteProfile delete_profile = 23;
    ListProfileRules list_profile_rules = 24;
    SetProfileRules set_profile_rules = 25;

    // Development firmware only.
    ListFeatures list_features = 26;
    ListFiles list_files = 27;
    ReadFile read_file = 28;
  }
}

// Dongle to client. A frame contains either one response or one event. Clients decode the complete
// frame before applying it; an unfinished frame is discarded when the session ends.
//
// A list response can be produced incrementally by concatenating protobuf encodings of Message
// values with the same Response.result list variant. Embedded messages merge and repeated entries
// append under protobuf's decoding rules. Identifying fields, such as device or profile, stay the
// same throughout the response. The combined bytes pass through one continuous COBS encoding and
// one final zero delimiter. The pieces have no separate framing or client continuation requests.
// An empty list still sets its result variant.
//
// If a listing fails after some entries have been encoded, the Dongle appends a Message containing
// Response.error and finishes the frame. The error replaces the list result under protobuf's oneof
// rules; no list entries follow the error. Clients discard the partial list and report the error.
// The Dongle never terminates a failed listing as a successful partial list.
//
// Events do not interleave with a response's pieces. The Dongle retains pending changes during the
// response and sends their events afterward. It reads the next request only after the response
// has been written. Listings reflect records as they are read, not a snapshot at one instant.
message Message {
  oneof kind {
    Response response = 1;
    Event event = 2;
  }
}

// The answer to one Request. No result set means success with no result. A successful save is
// durable before its response is sent. If applying the saved preferences changes the USB layout,
// the Dongle finishes transmitting the response before ending the serial session and reconnecting
// USB, subject to a short response-drain deadline chosen by the backend. Continued host traffic
// does not extend that deadline. At detach, the old serial session ends; after reconnecting, clients
// read Status rather than waiting for an event from that session. The Dongle calculates the
// allocation before disconnecting and exposes what fits without rolling back saved preferences.
// USB capacity shortages appear in Status.errors and do not reject saves.
message Response {
  oneof result {
    Error error = 1;
    Status status = 2;
    Device device = 3;
    DeviceList devices = 4;
    DeviceSettings settings = 5;
    FeatureList features = 6;
    FileList files = 7;
    FileData file = 8;
    Profile profile = 9;
    ProfileList profiles = 10;
    ProfileRules profile_rules = 11;
    ProfileCreated profile_created = 12;
  }
}

// Change events carry only what changed. A client applies them to what it has listed, and lists
// again when it needs a fresh view, such as in a new session.
message Event {
  oneof kind {
    // An adapter preference, readiness, information, error list or resource count changed.
    Status adapter = 1;
    // Anything in a device record changed, including a newly paired device.
    Device device = 2;
    // A device has been unpaired.
    DeviceRemoved device_removed = 3;
    // A scan found a candidate, or a candidate's name or signal changed.
    Candidate scan_found = 4;
    // A scan ended, by timeout or StopScan.
    ScanDone scan_done = 5;
    // The pairing changed state.
    Pairing pairing = 6;
    // A profile was created or copied, or its roles changed.
    Profile profile = 7;
    // A profile has been deleted.
    ProfileRemoved profile_removed = 8;
    // Some of a device's settings changed, appeared or went away.
    SettingsChanged settings_changed = 9;
  }
}

// ---------------------------------------------------------------------------
// Adapter
// ---------------------------------------------------------------------------

message GetStatus {}

// Partial update: missing fields are left unchanged. Responds with no result once saved; an adapter
// event follows when anything changed.
message SetAdapter {
  // 1..64 bytes, no control characters. "" restores the firmware default name.
  optional string name = 1;
  optional Platform platform = 2;
  // Transport preferences to change, applied in order. Transports not listed are left
  // unchanged. A transport this firmware does not support returns ERROR_CODE_UNSUPPORTED.
  repeated TransportUpdate transports = 3;
  // Configuration interface preferences to change, applied in order. Interfaces not listed are
  // left unchanged. An interface this firmware does not support returns ERROR_CODE_UNSUPPORTED.
  repeated ConfigurationInterfaceUpdate configuration_interfaces = 4;
}

// Partial update of one configuration interface's preferences. USB reconnects only when the
// resulting interface allocation changes, after the response has finished transmitting.
message ConfigurationInterfaceUpdate {
  // Required.
  ConfigurationInterface interface = 1;
  // Whether the interface is requested in the USB allocation. An enabled interface needs a profile in
  // the resulting configuration, or the request returns ERROR_CODE_BAD_ARGS. A resulting
  // configuration that enables it together with an interface listed in its conflicts returns
  // ERROR_CODE_UNSUPPORTED.
  optional bool enabled = 2;
  // The profile the interface reads and changes. 0 clears it. A profile that does not exist
  // returns ERROR_CODE_NOT_FOUND.
  optional uint32 profile = 3;
}

// Partial update of one transport's preferences.
message TransportUpdate {
  // Required.
  Transport transport = 1;
  // Whether the Dongle uses this transport: scans, connects and accepts connections on it.
  optional bool enabled = 2;
}

// Responds, then reboots into the ROM programming mode. Development firmware only.
message EnterBootloader {}

message Status {
  // Required. Adapter ID: 16 uppercase hexadecimal digits, which also begin the USB serial
  // number. Stable across boots.
  string id = 1;
  // Effective adapter name.
  string name = 2;
  // Saved host platform used for special-key translation.
  Platform platform = 3;
  // Bluetooth and storage have started. Until then, commands that need either return
  // ERROR_CODE_NOT_READY.
  bool ready = 4;
  // Complete set of current adapter problems, without duplicates, in numeric order. Empty clears
  // all adapter errors. Each applicable code is reported and shown independently, including when
  // both USB capacity codes apply. Changes arrive in Event.adapter.
  repeated ErrorCode errors = 5;
  // Current resource usage, at most one entry per type. Missing types are not reported; clients
  // ignore unknown types. Changes arrive in Event.adapter.
  // INTERFACES counts USB interfaces actually exposed; limit is the compiled interface maximum.
  // Every interface of a multi-interface function counts. Other USB resource limits can cause
  // allocation errors even when this count is below its limit.
  // USB allocation prefers lower priorities: serial 0x00; keyboard/mouse required by a connected
  // device 0x41; HID gamepad selected by a connected device 0x42; XInput selected by a connected
  // device 0x43; enabled editor used by a connected device's selected profile 0x44; disconnected
  // configured keyboard/mouse and the first configured HID/XInput slots 0x81..0x83; additional configured disconnected HID and
  // XInput slots 0xC2/0xC3; an enabled editor without a connected user of its profile 0xC4;
  // unconfigured HID/XInput slots up to the compiled maxima 0xE2/0xE3. Each slot uses the lowest
  // applicable value. Configured users are saved devices whose roles, output preferences or
  // profile outputs use the interface, regardless of connection state. Keyboard/mouse is absent
  // without configured users. An editor uses 0x44 only when enabled and a connected device uses
  // the editor's selected profile. An editor with enabled = false has priority 0xFF and is excluded.
  repeated ResourceCapacity resources = 6;
  // One entry per transport this firmware supports, whether enabled or not. A transport that is
  // not listed is not supported.
  repeated TransportSupport transports = 7;
  // Complete facts about the Dongle itself. Missing fields are unknown.
  AdapterInformation information = 8;
  // Missing when the board has no profile support, which also leaves configuration_interfaces
  // empty.
  ProfileSupport profile_support = 9;
  // One entry per configuration interface this firmware supports, whether enabled or not. An
  // interface that is not listed is not supported.
  repeated ConfigurationInterfaceSupport configuration_interfaces = 10;
  // Implemented output backends. Unlisted enabled modes are unsupported. Gamepad Disabled is
  // always accepted, including when no output backends are listed.
  repeated OutputSupport output_support = 11;
}

// A resource count and its allowance, scoped to the containing object, which defines the units
// and meaning for each type. Either value can be reported independently. Missing values are
// unknown, not zero or unlimited; limit-only entries omit count.
message ResourceCapacity {
  ResourceType type = 1;
  optional uint32 count = 2;
  optional uint32 limit = 3;
}

// Resource kinds whose scope and meaning are defined by the containing object's resources field.
enum ResourceType {
  RESOURCE_TYPE_UNKNOWN = 0;
  RESOURCE_TYPE_INTERFACES = 1;
  RESOURCE_TYPE_SLOTS = 2;
  RESOURCE_TYPE_DEVICES = 3;
  RESOURCE_TYPE_CONNECTIONS = 4;
  RESOURCE_TYPE_MEMORY = 5;
  RESOURCE_TYPE_OUTPUTS = 6;
  RESOURCE_TYPE_LAYERS = 7;
}

// What the Dongle supports for one transport. Per-transport limits and capabilities are added here
// as fields, never as per-transport fields on Status.
message TransportSupport {
  // Required.
  Transport transport = 1;
  // The transport is enabled on the Dongle. A disabled transport's devices are inactive, and the
  // Dongle does not scan, connect or accept connections on it. Classic starts disabled and BLE
  // enabled. The Dongle always sets it. Missing means enabled.
  optional bool enabled = 2;
  // Resource usage for this transport, at most one entry per type. Missing types are unknown,
  // not zero; clients ignore unknown types and let the Dongle enforce its limits.
  // DEVICES counts saved devices enabled for this transport, even when the transport is disabled;
  // limit is its enabled allowance. count can exceed limit when saved preferences exceed the
  // compiled capacity. CONNECTIONS counts occupied normal connection slots, including closing
  // slots when admission still counts them; limit is their allowance.
  // Both allowances are equal and exclude the additional pairing slot, as do both counts.
  // Limits are independent across transports; enabling Classic does not lower the BLE limit.
  repeated ResourceCapacity resources = 3;
}

enum Platform {
  PLATFORM_LINUX = 0;
  PLATFORM_WINDOWS = 1;
  PLATFORM_MAC = 2;
}

// An external editing protocol the Dongle can expose over USB, letting a Host editor read and
// change one profile. The serial API is available whatever is enabled, and profiles map input
// whether or not any interface is enabled.
enum ConfigurationInterface {
  CONFIGURATION_INTERFACE_UNSPECIFIED = 0;
  // VIA protocol; also used by compatible Remap clients.
  CONFIGURATION_INTERFACE_VIA = 1;
  CONFIGURATION_INTERFACE_VIAL = 2;
}

// What the Dongle supports for one configuration interface, with its saved preferences.
// Per-interface limits and capabilities are added here as fields, never as per-interface fields on
// Status.
message ConfigurationInterfaceSupport {
  // Required. A client keeps an interface it does not know and passes it back unchanged.
  ConfigurationInterface interface = 1;
  // Saved preference requesting the interface in the USB allocation, even when it cannot fit.
  bool enabled = 2;
  // Whether the interface is currently exposed over USB.
  bool active = 3;
  // The profile the interface reads and changes, kept while the interface is disabled. 0 when
  // none is selected.
  uint32 profile = 4;
  // Interfaces this firmware cannot expose at the same time as this one.
  repeated ConfigurationInterface conflicts = 5;
}

// ---------------------------------------------------------------------------
// Discovery and pairing
// ---------------------------------------------------------------------------

// Candidates arrive as scan_found events; the scan ends with scan_done. Starting a running scan
// restarts its timer.
message StartScan {
  // Required, at least one. Transports to scan. Those the firmware does not support or has disabled
  // are left out. An empty list returns ERROR_CODE_BAD_ARGS, and a list with nothing left to scan
  // returns ERROR_CODE_UNSUPPORTED.
  repeated Transport transports = 1;
  // 1..60. Zero means 10.
  uint32 seconds = 2;
}

// Ends the scan early. Candidates already found stay usable.
message StopScan {}

// Progress arrives as pairing events. Only one pairing runs at a time; another returns
// ERROR_CODE_BUSY.
message StartPairing {
  // Required.
  uint32 candidate = 1;
}

// Answers the open prompt. Returns ERROR_CODE_NO_PROMPT when none is open.
message AcceptPrompt {
  // The passkey or PIN, when the step is EnterCode.
  string value = 1;
}

// Rejects the open prompt; pairing fails with ERROR_CODE_REJECTED.
message RejectPrompt {}

// Cancels a pairing that has not saved its bond.
message CancelPairing {}

message Candidate {
  // Required. Positive. Valid until the next scan starts or the session ends. Candidate IDs are
  // separate from device IDs.
  uint32 id = 1;
  // Required.
  Transport transport = 2;
  // Advertised name, or "" when none.
  string name = 3;
  // What the candidate says it is. Empty when unknown. A client skips kinds it does not know.
  repeated Kind kinds = 4;
  // Signal strength in dBm.
  optional sint32 rssi = 5;
}

message ScanDone {
  uint32 count = 1;
  // The candidate limit was reached.
  bool truncated = 2;
}

message Pairing {
  // Required.
  uint32 candidate = 1;
  // Required. Where the pairing is. A client that sees no step set treats the pairing as still in
  // progress.
  oneof step {
    PairingConnecting connecting = 2;
    EnterCode enter_code = 3;
    ConfirmCode confirm_code = 4;
    ShowCode show_code = 5;
    PairingDone done = 6;
    // Pairing ended. Existing bonds are unchanged.
    ErrorCode failed = 7;
  }
}

// Setting up the link and security.
message PairingConnecting {}

// The user types a code. Answer with AcceptPrompt carrying it, or RejectPrompt.
message EnterCode {
  CodeKind kind = 1;
}

// The user checks that passkey matches the one the device shows. Answer with AcceptPrompt or
// RejectPrompt.
message ConfirmCode {
  // Required. Six decimal digits.
  string passkey = 1;
}

// The user types value on the device. No reply is needed.
message ShowCode {
  CodeKind kind = 1;
  // Required.
  string value = 2;
}

// The bond is saved. An enabled device's connection progress follows as device events.
message PairingDone {
  // Required. The saved device ID.
  uint32 device = 1;
}

enum CodeKind {
  CODE_KIND_UNKNOWN = 0;
  // Six decimal digits, including leading zeros.
  CODE_KIND_PASSKEY = 1;
  // A legacy PIN: 1 to 16 printable ASCII characters.
  CODE_KIND_PIN = 2;
}

// ---------------------------------------------------------------------------
// Devices
// ---------------------------------------------------------------------------

// Lists all saved devices in ascending ID order. Responds with DeviceList.
message ListDevices {}

// All saved devices, in ascending ID order. Every List command returns its complete list in one
// response, which the Dongle can encode incrementally as described by Message. Entries occur
// once in the listing's order; an empty list is valid. The frame delimiter completes the response.
message DeviceList {
  repeated DeviceListEntry entries = 1;
}

message DeviceListEntry {
  // Required.
  oneof entry {
    Device device = 1;
    // The ID of a device whose saved record could not be read from flash. The listing continues
    // past it. An undecodable record is removed as lost and is not listed.
    uint32 unreadable = 2;
  }
}

message GetDevice {
  // Required.
  uint32 device = 1;
}

// Partial update: missing fields are left unchanged. Responds with no result once saved; a device
// event follows when anything changed. Effects that need the radio (disconnecting, starting an
// integration) follow as further device events.
message SetDevice {
  // Required.
  uint32 device = 1;
  // Whether the device is loaded into the Bluetooth stack so it can connect. False unloads and
  // disconnects it; it stays saved. True returns ERROR_CODE_NO_CAPACITY with
  // CAPACITY_REASON_ENABLED when the transport's RESOURCE_TYPE_DEVICES allowance is full.
  optional bool enabled = 2;
  // Whether the device may reconnect on its own.
  optional bool trusted = 3;
  // Whether the device is refused all connections. True disconnects it.
  optional bool blocked = 4;
  // Integration preferences to change, applied in order. Integrations not listed are left
  // unchanged. A kind this firmware does not know returns ERROR_CODE_UNSUPPORTED.
  repeated IntegrationUpdate integrations = 5;
  // The device's profile layers. Missing leaves them unchanged. Without profile support it returns
  // ERROR_CODE_UNSUPPORTED. A connected device uses the new layers from its next input.
  ProfileLayers profiles = 6;
  // Changes applied in order, with the last entry for a role winning. Missing leaves preferences
  // unchanged. Enabled modes require Status.output_support to advertise them. Gamepad Disabled
  // is always accepted.
  repeated OutputPreference output_preferences = 7;
}

// Partial update of one integration's preferences.
message IntegrationUpdate {
  // Required.
  IntegrationKind kind = 1;
  // Whether the Dongle uses this integration: applies its translation and saved settings.
  optional bool enabled = 2;
}

// Clears a disconnect pause and starts connecting. An immediate refusal responds with Error.
// An accepted attempt responds with Device; a later failure arrives in Event.device as
// DEVICE_STATE_DISCONNECTED with the failure code in Device.errors.
message ConnectDevice {
  // Required.
  uint32 device = 1;
}

// Disconnects and pauses reconnection until ConnectDevice or the Dongle restarts. Responds with
// Device.
message DisconnectDevice {
  // Required.
  uint32 device = 1;
}

// Deletes the bond and the device's settings. device_removed follows once it is gone.
message UnpairDevice {
  // Required.
  uint32 device = 1;
}

// Re-reads device information and settings from a connected device. Changes arrive as
// device and settings_changed events.
message RefreshDevice {
  // Required.
  uint32 device = 1;
}

message DeviceRemoved {
  // Required.
  uint32 id = 1;
}

message Device {
  // Required. Positive. Stable for the life of the bond and never reused.
  uint32 id = 1;
  // Required.
  Transport transport = 2;
  // Best known name: the device-reported name, otherwise the name seen at pairing.
  string name = 3;
  // What the device is, such as both a keyboard and a mouse. Empty when unknown. A client skips
  // kinds it does not know.
  repeated Kind kinds = 4;
  DeviceState state = 5;
  // The saved preferences set with SetDevice.
  bool enabled = 6;
  bool trusted = 7;
  bool blocked = 8;
  // A DisconnectDevice is holding reconnection off.
  bool paused = 9;
  // Missing when the Dongle will use this device. Otherwise why not.
  optional InactiveReason inactive = 10;
  // Complete set of connection and profile problems, without duplicates, in numeric order.
  // Integration and setting failures stay on their respective records. At most one connection
  // failure is present; a new failure replaces it. It clears after a successful connection,
  // disabling the device or restarting the Dongle.
  // Profile errors apply only while connected and clear when profiles load or the device
  // disconnects. Empty clears all device errors. Changes arrive in Event.device.
  repeated ErrorCode errors = 11;
  // Link security while connected.
  Security security = 12;
  // Every integration the device has a saved preference for or is detected with on the current
  // link.
  repeated Integration integrations = 13;
  // Complete facts from the current connection. Missing while disconnected. Replaces the
  // previous information, including clearing fields that are absent or unknown.
  DeviceInformation information = 14;
  // The kinds of input the device produces, learned from its HID descriptor and saved. Empty until
  // the descriptor has first been read. A client skips roles it does not know.
  repeated Role roles = 15;
  // The device's saved profile layers. A new device has none. Missing when the board has no
  // profile support.
  ProfileLayers profiles = 16;
  // Saved output choices. A missing gamepad choice means Disabled.
  repeated OutputPreference output_preferences = 17;
  // Current output state, independent of Bluetooth connection admission.
  repeated OutputStatus outputs = 18;
}

enum Role {
  // A role this client does not know.
  ROLE_UNKNOWN = 0;
  // Keys and modifiers.
  ROLE_KEYBOARD = 1;
  // Pointer movement, buttons and wheels.
  ROLE_MOUSE = 2;
  // Media and volume keys.
  ROLE_CONSUMER_CONTROL = 3;
  // Power, sleep and wake keys.
  ROLE_SYSTEM_CONTROL = 4;
  ROLE_GAMEPAD = 5;
}

enum OutputMode {
  OUTPUT_MODE_DISABLED = 0;
  OUTPUT_MODE_HID = 1;
  OUTPUT_MODE_XINPUT = 2;
}

message OutputPreference {
  // Required. Only Gamepad is configurable.
  Role role = 1;
  OutputMode mode = 2;
}

message OutputSupport {
  // Required.
  Role role = 1;
  repeated OutputModeSupport modes = 2;
}

message OutputModeSupport {
  OutputMode mode = 1;
  // Resource usage for this mode, at most one entry per type. Missing types are not reported;
  // clients ignore unknown types. SLOTS counts the enumerated slot pool, not the number assigned
  // to connected devices, and is absent until known. limit is the compiled slot maximum, at most
  // four for each gamepad mode. Disabled has count and limit both zero.
  repeated ResourceCapacity resources = 2;
}

message OutputStatus {
  // Required.
  Role role = 1;
  OutputMode mode = 2;
  OutputState state = 3;
  // Zero-based temporary slot within the role and mode, only while Active.
  optional uint32 slot = 4;
}

enum OutputState {
  OUTPUT_STATE_UNKNOWN = 0;
  OUTPUT_STATE_DISABLED = 1;
  OUTPUT_STATE_DISCONNECTED = 2;
  OUTPUT_STATE_PENDING = 3;
  OUTPUT_STATE_ACTIVE = 4;
  OUTPUT_STATE_UNSUPPORTED = 5;
}

enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_CLASSIC = 1;
  TRANSPORT_BLE = 2;
}

enum Kind {
  // A kind this client does not know.
  KIND_UNKNOWN = 0;
  KIND_KEYBOARD = 1;
  KIND_MOUSE = 2;
  // Known, without a more specific kind.
  KIND_OTHER = 3;
  KIND_GAMEPAD = 4;
}

enum DeviceState {
  DEVICE_STATE_DISCONNECTED = 0;
  DEVICE_STATE_CONNECTING = 1;
  // Input is being forwarded.
  DEVICE_STATE_CONNECTED = 2;
  DEVICE_STATE_DISCONNECTING = 3;
}

enum InactiveReason {
  // Inactive for a reason this client does not know.
  INACTIVE_REASON_UNKNOWN = 0;
  // This firmware does not support the device's transport.
  INACTIVE_REASON_UNSUPPORTED_TRANSPORT = 1;
  INACTIVE_REASON_BLOCKED = 2;
  INACTIVE_REASON_DISABLED = 3;
  // Enabled in saved preferences but excluded because the transport's
  // RESOURCE_TYPE_DEVICES allowance cannot accommodate every enabled device.
  INACTIVE_REASON_CAPACITY = 4;
  // The firmware supports the device's transport, but it is disabled on the Dongle.
  INACTIVE_REASON_TRANSPORT_DISABLED = 5;
}

// Each field is missing when the Bluetooth stack does not report it.
message Security {
  optional bool encrypted = 1;
  optional bool authenticated = 2;
  optional bool secure_connections = 3;
  optional uint32 key_size = 4;
}

// A protocol the Dongle speaks with a device on top of standard HID, providing special-key
// translation, settings and features.
enum IntegrationKind {
  INTEGRATION_KIND_UNSPECIFIED = 0;
  // Logitech HID++.
  INTEGRATION_KIND_HIDPP = 1;
}

message Integration {
  // Required. A client keeps a kind it does not know and passes it back unchanged.
  IntegrationKind kind = 1;
  // Saved preference set with SetDevice.
  bool enabled = 2;
  // Present when the device speaks this integration on the current link.
  IntegrationDetection detected = 3;
  // Required. Whether the integration is up, or why it failed. A client that sees neither set
  // treats the integration as off.
  oneof status {
    IntegrationState state = 4;
    // Connected, and starting failed.
    ErrorCode error = 5;
  }

  // Fields 20 and up carry details specific to one kind, which a client never needs in order to
  // show or use the integration.
}

message IntegrationDetection {
  // The protocol version the device reported.
  Version version = 1;
}

message Version {
  uint32 major = 1;
  uint32 minor = 2;
}

// Whether an integration is up on the device. Settings never report their own availability:
// ListSettings shows what is known, and a settings_changed event follows whenever an integration
// coming up or going down changes that.
enum IntegrationState {
  // Turned off with SetDevice. Unknown states also read as this.
  INTEGRATION_STATE_OFF = 0;
  // Turned on, and the device is not connected.
  INTEGRATION_STATE_DISCONNECTED = 1;
  // Connected; detecting the integration, reading its settings and applying saved values.
  INTEGRATION_STATE_STARTING = 2;
  // Up: its settings have been read and saved values are applied. Special-key translation runs
  // wherever the device supports it and is never reported.
  INTEGRATION_STATE_ACTIVE = 3;
  // Connected, and the device cannot use this integration at all, such as a device without usable
  // HID++ reports.
  INTEGRATION_STATE_UNSUPPORTED = 4;
}

// ---------------------------------------------------------------------------
// Information
// ---------------------------------------------------------------------------

// Each scalar has independent presence. Missing means unknown, including for booleans and
// numbers. Text is at most 64 UTF-8 bytes without control characters.
message AdapterInformation {
  optional string firmware_version = 1;
  optional string board_name = 2;
  optional bool development_build = 3;
}

// Read-only facts, never saved to flash. All readings belong to the current connection and
// clear on disconnect. A missing scalar means unknown, not false, zero or an empty string.
// Text is at most 64 UTF-8 bytes without control characters. A reported enum value that cannot
// be interpreted uses its UNKNOWN member; it never implies a known mode.
//
// Valid integration readings take precedence while that integration is enabled; otherwise
// valid standard-service readings apply. A failed preferred read permits a valid fallback,
// except for battery readings, whose source rules are defined on BatteryInformation.
// Configurable behavior appears here only when the device does not accept writes for it.
// A saved preference for such a field remains in DeviceSettings with UNSUPPORTED status.
message DeviceInformation {
  DeviceIdentity identity = 1;
  BatteryInformation battery = 2;
  KeyboardInformation keyboard = 3;
  PowerInformation power = 4;
  BacklightInformation backlight = 5;
  // At most two supported physical sensors, once each, in ascending index order.
  repeated PointerSensorInformation pointer_sensors = 6;
  WheelInformation wheel = 7;
  ThumbwheelInformation thumbwheel = 8;
}

message DeviceIdentity {
  optional string manufacturer = 1;
  optional string model = 2;
  optional string serial = 3;
  optional string firmware_version = 4;
  optional string bootloader_version = 5;
  optional string hardware_revision = 6;
  optional string software_revision = 7;
  VendorIdentity vendor = 8;
  ProductIdentity product = 9;
}

message VendorIdentity {
  // Registry that assigns id. Missing means its registry is unknown.
  optional VendorRegistry registry = 1;
  // Unsigned 16-bit identifier in registry.
  optional uint32 id = 2;
}

message ProductIdentity {
  // Unsigned 16-bit product identifier assigned by the device's vendor.
  optional uint32 id = 1;
  // Unsigned 16-bit product version reported by the device, not a firmware version string.
  optional uint32 version = 2;
}

enum VendorRegistry {
  VENDOR_REGISTRY_UNKNOWN = 0;
  VENDOR_REGISTRY_USB = 1;
  VENDOR_REGISTRY_BLUETOOTH = 2;
}

// HID++ supplies battery readings while enabled and usable. Otherwise BLE uses its Battery
// Service and Classic uses standard HID battery reports. A missing or failed reading never
// falls back to a different source. With several batteries, use the explicitly identified main
// battery, otherwise the lowest known level; charging must describe that same battery.
message BatteryInformation {
  // Percent, 0..100. Coarse readings map full to 100, high/good to 75, medium to 50, low to 20,
  // critical to 5 and empty to 0. A level never implies a charging state.
  optional uint32 level = 1;
  optional bool charging = 2;
}

message KeyboardInformation {
  // Key interpretation for the current device connection.
  optional KeyboardPlatform platform = 1;
  optional FunctionRowMode function_row = 2;
}

message PowerInformation {
  // Seconds of inactivity before automatic power-off. Zero disables automatic power-off.
  optional uint32 auto_off = 1;
}

message BacklightInformation {
  // Actual brightness, in device-defined steps, independently of the configured brightness.
  optional uint32 current_brightness = 1;
  optional BacklightStatus status = 2;
  optional bool enabled = 3;
  optional BacklightMode mode = 4;
  // Configured brightness, in device-defined steps.
  optional uint32 brightness = 5;
  BacklightDelayInformation delay = 6;
  // Whether the device plays its backlight startup effect.
  optional bool startup_effect = 7;
  // Whether the device plays its dial lighting effect.
  optional bool dial_effect = 8;
  // Whether the device reduces backlight use at critical battery levels.
  optional bool power_save = 9;
  optional BacklightEffect effect = 10;
}

message BacklightDelayInformation {
  // Seconds before dimming after hands leave the device.
  optional uint32 hands_away = 1;
  // Seconds before dimming with hands near the device.
  optional uint32 hands_nearby = 2;
  // Seconds before dimming while the device has external power.
  optional uint32 external_power = 3;
}

message PointerSensorInformation {
  // Zero-based physical sensor index, stable across connections to the same device.
  uint32 index = 1;
  // Dots per inch for this sensor.
  optional uint32 dpi = 2;
}

message WheelInformation {
  // High-resolution scroll units per ordinary wheel step.
  optional uint32 resolution_multiplier = 1;
  optional uint32 ratchets_per_rotation = 2;
  // Wheel diameter in millimetres.
  optional uint32 diameter = 3;
  optional WheelMode mode = 4;
  // Automatic free spin threshold in device-defined units, 1..255; 255 disables switching.
  optional uint32 free_spin_threshold = 5;
  // Whether the device reverses the wheel's scroll direction.
  optional bool invert = 6;
}

message ThumbwheelInformation {
  // Whether the device reverses the thumbwheel's scroll direction.
  optional bool invert = 1;
}

// UNKNOWN means the reported platform cannot be interpreted. It is never a writable choice.
enum KeyboardPlatform {
  KEYBOARD_PLATFORM_UNKNOWN = 0;
  KEYBOARD_PLATFORM_WINDOWS = 1;
  KEYBOARD_PLATFORM_WINDOWS_EMBEDDED = 2;
  KEYBOARD_PLATFORM_LINUX = 3;
  KEYBOARD_PLATFORM_CHROME_OS = 4;
  KEYBOARD_PLATFORM_ANDROID = 5;
  KEYBOARD_PLATFORM_MAC = 6;
  KEYBOARD_PLATFORM_IOS = 7;
  KEYBOARD_PLATFORM_WEBOS = 8;
  KEYBOARD_PLATFORM_TIZEN = 9;
}

enum FunctionRowMode {
  FUNCTION_ROW_MODE_UNKNOWN = 0;
  FUNCTION_ROW_MODE_FUNCTION_KEYS = 1;
  FUNCTION_ROW_MODE_SPECIAL_ACTIONS = 2;
}

enum BacklightStatus {
  BACKLIGHT_STATUS_UNKNOWN = 0;
  BACKLIGHT_STATUS_DISABLED = 1;
  // Illumination is limited by battery state.
  BACKLIGHT_STATUS_BATTERY = 2;
  BACKLIGHT_STATUS_AUTOMATIC = 3;
  BACKLIGHT_STATUS_SATURATED = 4;
  BACKLIGHT_STATUS_MANUAL = 5;
  BACKLIGHT_STATUS_PERMANENT_MANUAL = 6;
}

enum BacklightMode {
  BACKLIGHT_MODE_UNKNOWN = 0;
  BACKLIGHT_MODE_NONE = 1;
  BACKLIGHT_MODE_AUTOMATIC = 2;
  BACKLIGHT_MODE_TEMPORARY_MANUAL = 3;
  BACKLIGHT_MODE_PERMANENT_MANUAL = 4;
}

enum BacklightEffect {
  BACKLIGHT_EFFECT_UNKNOWN = 0;
  BACKLIGHT_EFFECT_STATIC = 1;
  BACKLIGHT_EFFECT_NONE = 2;
  BACKLIGHT_EFFECT_BREATHING = 3;
  BACKLIGHT_EFFECT_CONTRAST = 4;
  BACKLIGHT_EFFECT_REACTION = 5;
  BACKLIGHT_EFFECT_RANDOM = 6;
  BACKLIGHT_EFFECT_WAVES = 7;
}

enum WheelMode {
  WHEEL_MODE_UNKNOWN = 0;
  WHEEL_MODE_FREE_SPIN = 1;
  WHEEL_MODE_STEPPED = 2;
}

// ---------------------------------------------------------------------------
// Settings
// ---------------------------------------------------------------------------

// Lists every configurable field discovered on this connection and every saved preference, across
// integrations. Sends nothing to the device. Read-only behavior is in Device.information.
// Objects are ordered by integration, then SettingsGroup number, then component index.
// Clients apply the complete response, then subsequent events, and list again when they need a
// fresh view. Responds with DeviceSettings.
message ListSettings {
  // Required.
  uint32 device = 1;
}

// Identifies a complete domain object, never an individual setting.
message SettingsRef {
  // Required. The integration owning the settings.
  IntegrationKind integration = 1;
  // Required. UNKNOWN does not identify an object.
  SettingsGroup group = 2;
  // Zero-based component index within group.
  // Required for POINTER_SENSOR; absent for other current groups.
  optional uint32 index = 3;
}

enum SettingsGroup {
  SETTINGS_GROUP_UNKNOWN = 0;
  SETTINGS_GROUP_KEYBOARD = 1;
  SETTINGS_GROUP_POWER = 2;
  SETTINGS_GROUP_BACKLIGHT = 3;
  SETTINGS_GROUP_POINTER_SENSOR = 4;
  SETTINGS_GROUP_WHEEL = 5;
  SETTINGS_GROUP_THUMBWHEEL = 6;
}

// Saves and forgets preferences in one storage write and responds with no result once durable.
// Missing fields leave their preferences unchanged. Each present field must select a value or
// forget; an empty change is invalid. Changes apply in list order, with the last change to each
// field winning. Validation failure saves and applies nothing. A save failure starts no apply;
// Error.outcome_unknown reports when durability cannot be determined. Clients then read back
// saved values. A confirmed storage failure leaves the previous preferences unchanged.
//
// Validation uses the advertised limits, retained with saved preferences while disconnected.
// Unknown integrations, groups, fields and sensor indices cannot be saved. Read-only fields
// cannot be saved. A value outside the advertised limits returns ERROR_CODE_BAD_ARGS; saving
// an unavailable field returns ERROR_CODE_NOT_FOUND and a read-only field ERROR_CODE_UNSUPPORTED.
// Forgetting a known field with no saved preference succeeds, including when it is read-only.
//
// A valid value is saved even while disconnected, busy, disabled, or in an inapplicable mode.
// It stays PENDING until confirmed by readback or the device's documented confirmation.
// After responding, the Dongle re-applies all saved settings of each named integration. The
// same apply runs when an integration starts or the adapter platform changes. It reads first,
// skips equal values, writes differences and confirms them. Fields sharing a
// device setter are written together, preserving unsaved fields. A failed setter does not undo
// other setters or integrations. Failures belong to each affected field's SettingStatus,
// separately from Integration.error; saved preferences survive for the next apply attempt.
// A timeout uses ERROR_CODE_TIMEOUT: the write may have taken effect, so the next apply reads
// before writing. A forgotten setting is no longer written; its actual device value is unchanged.
// Only this command creates saved preferences. SettingsChanged follows every resulting change.
message SetSettings {
  // Required.
  uint32 device = 1;
  // Required, at least one changed field. The whole Request must fit in 1024 protobuf bytes.
  repeated SettingsUpdate changes = 2;
}

// Partial update of one domain. A missing nested message or field leaves it unchanged.
message SettingsUpdate {
  // Required. The integration owning the settings.
  IntegrationKind integration = 1;
  // Required.
  oneof group {
    KeyboardSettingsUpdate keyboard = 2;
    PowerSettingsUpdate power = 3;
    BacklightSettingsUpdate backlight = 4;
    PointerSensorSettingsUpdate pointer_sensor = 5;
    WheelSettingsUpdate wheel = 6;
    ThumbwheelSettingsUpdate thumbwheel = 7;
  }
}

// All settings objects, ordered as ListSettings. Each object includes its complete settings and
// saved metadata. Objects are never silently truncated to fit a transmission buffer.
message DeviceSettings {
  // Required.
  uint32 device = 1;
  repeated SettingsObject objects = 2;
}

// Each changed object replaces the entire previous object with that identity. Omitted fields
// remove prior capabilities; a present field with value absent resets its reading to unknown;
// saved absent clears a saved preference. An object without any fields is removed instead.
// Objects not named in changed or removed are unchanged. A ref occurs at most once in an event
// and cannot occur in both lists. Clients apply an event only after its complete frame arrives.
// Changes across events are not atomic.
message SettingsChanged {
  // Required.
  uint32 device = 1;
  repeated SettingsObject changed = 2;
  repeated SettingsRef removed = 3;
}

// A complete domain, owned by integration. Its SettingsRef is derived from the selected group
// and its component index when applicable. At most one object exists for each identity.
// Only configurable fields discovered on this connection or fields with a saved preference appear.
// A field with a saved preference remains even when its capability disappears, with UNSUPPORTED
// status. On disconnect, fields without saved preferences disappear; the rest retain their
// saved metadata and clear value. Integration.state determines availability and freshness.
message SettingsObject {
  // Required. Matches a Device.integrations entry.
  IntegrationKind integration = 1;
  // Required. At least one setting field is present in the selected domain.
  oneof group {
    KeyboardSettings keyboard = 2;
    PowerSettings power = 3;
    BacklightSettings backlight = 4;
    PointerSensorSettings pointer_sensor = 5;
    WheelSettings wheel = 6;
    ThumbwheelSettings thumbwheel = 7;
  }
}

message KeyboardSettings {
  // Key interpretation for the current connection, including the current host slot when
  // the device stores a platform per host. Other host slots are never read or changed.
  KeyboardPlatformSetting platform = 1;
  // Default function-row behavior, scoped to this connection or its current host slot.
  FunctionRowModeSetting function_row = 2;
}

message PowerSettings {
  // Device inactivity timeout in seconds. Zero disables automatic power-off.
  IntegerSetting auto_off = 1;
}

message BacklightSettings {
  BoolSetting enabled = 1;
  BacklightModeSetting mode = 2;
  // Configured brightness in device-defined steps. Remains PENDING in modes that cannot
  // apply it, then applies when the device enters a compatible mode.
  IntegerSetting brightness = 3;
  BacklightDelaySettings delay = 4;
  // Whether the device plays its backlight startup effect.
  BoolSetting startup_effect = 5;
  // Whether the device plays its dial lighting effect.
  BoolSetting dial_effect = 6;
  // Whether the device reduces backlight use at critical battery levels.
  BoolSetting power_save = 7;
  BacklightEffectSetting effect = 8;
}

message BacklightDelaySettings {
  // Device timeout in seconds after hands leave the device.
  IntegerSetting hands_away = 1;
  // Device timeout in seconds with hands near the device.
  IntegerSetting hands_nearby = 2;
  // Device timeout in seconds while externally powered.
  IntegerSetting external_power = 3;
}

message PointerSensorSettings {
  // Zero-based physical sensor index, stable across connections to the same device.
  uint32 index = 1;
  // Dots per inch for this sensor, independent of any other sensor.
  IntegerSetting dpi = 2;
}

message WheelSettings {
  WheelModeSetting mode = 1;
  // Automatic free spin threshold, 1..255; 255 disables automatic switching.
  IntegerSetting free_spin_threshold = 2;
  // Whether the device reverses the wheel's scroll direction.
  BoolSetting invert = 3;
}

message ThumbwheelSettings {
  // Whether the device reverses the thumbwheel's scroll direction.
  BoolSetting invert = 1;
}

// Every setting wrapper has independent value and saved presence. value is the last actual
// reading, never an echo of saved. It is current while the owning integration is ACTIVE and
// otherwise possibly stale on the current connection. It is absent before the first read and
// after disconnect. saved is present only for an explicit preference stored on the Dongle.
// status is present exactly when saved is present, and describes only that field's last apply.
// Integer units and scope come from the containing domain field. All writes affect only this
// device and its current connection; no setting changes another paired host's preferences.
message BoolSetting {
  optional bool value = 1;
  optional bool saved = 2;
  SettingStatus status = 3;
}

message IntegerSetting {
  optional sint64 value = 1;
  optional sint64 saved = 2;
  SettingStatus status = 3;
  // Accepted values. Neither means any integer; a saved field keeps its limits while offline.
  oneof limits {
    IntegerRange range = 4;
    IntegerChoices choices = 5;
  }
}

message IntegerRange {
  sint64 min = 1;
  sint64 max = 2;
  // Accepted values are min, min + step, and so on through max. Zero means 1.
  uint64 step = 3;
}

message IntegerChoices {
  // Complete nonempty discrete set, at most six distinct values. A contiguous or stepped set uses
  // IntegerRange. Limits are retained in full, including while the device is disconnected.
  repeated sint64 values = 1;
}

// Per-field apply result, independent of the integration's own startup error.
message SettingStatus {
  // Required.
  oneof result {
    SettingState state = 1;
    ErrorCode error = 2;
  }
}

enum SettingState {
  // An unrecognized apply state provides no confirmation that the preference took effect.
  SETTING_STATE_UNKNOWN = 0;
  SETTING_STATE_PENDING = 1;
  // The actual value is confirmed equal to the saved preference.
  SETTING_STATE_APPLIED = 2;
  // The device reports another value. The next apply restores the saved preference.
  SETTING_STATE_CHANGED_ON_DEVICE = 3;
  // The device does not support this saved setting.
  SETTING_STATE_UNSUPPORTED = 4;
}

// Explicitly forget one field's saved preference. Never resets the actual device value.
message SettingForget {}

message BoolSettingUpdate {
  // Required. Selecting value preserves false as an explicit write.
  oneof change {
    bool value = 1;
    SettingForget forget = 2;
  }
}

message IntegerSettingUpdate {
  // Required. Selecting value preserves zero as an explicit write.
  oneof change {
    sint64 value = 1;
    SettingForget forget = 2;
  }
}

// value may report a mode outside choices. UNKNOWN means an uninterpretable reading.
// choices contains each writable, known enum member at most once and excludes UNKNOWN.
// An empty choices list grants no writable value. saved metadata survives disconnect.
message KeyboardPlatformSetting {
  optional KeyboardPlatform value = 1;
  optional KeyboardPlatform saved = 2;
  SettingStatus status = 3;
  repeated KeyboardPlatform choices = 4;
}

message KeyboardPlatformSettingUpdate {
  // Required. UNKNOWN and unrecognized enum values cannot be saved.
  oneof change {
    KeyboardPlatform value = 1;
    SettingForget forget = 2;
  }
}

// value may report a mode outside choices. UNKNOWN means an uninterpretable reading.
// choices contains each writable, known enum member at most once and excludes UNKNOWN.
// An empty choices list grants no writable value. saved metadata survives disconnect.
message FunctionRowModeSetting {
  optional FunctionRowMode value = 1;
  optional FunctionRowMode saved = 2;
  SettingStatus status = 3;
  repeated FunctionRowMode choices = 4;
}

message FunctionRowModeSettingUpdate {
  // Required. UNKNOWN and unrecognized enum values cannot be saved.
  oneof change {
    FunctionRowMode value = 1;
    SettingForget forget = 2;
  }
}

// value may report a mode outside choices. UNKNOWN means an uninterpretable reading.
// choices contains each writable, known enum member at most once and excludes UNKNOWN.
// An empty choices list grants no writable value. saved metadata survives disconnect.
message BacklightModeSetting {
  optional BacklightMode value = 1;
  optional BacklightMode saved = 2;
  SettingStatus status = 3;
  repeated BacklightMode choices = 4;
}

message BacklightModeSettingUpdate {
  // Required. UNKNOWN and unrecognized enum values cannot be saved.
  oneof change {
    BacklightMode value = 1;
    SettingForget forget = 2;
  }
}

// value may report a mode outside choices. UNKNOWN means an uninterpretable reading.
// choices contains each writable, known enum member at most once and excludes UNKNOWN.
// An empty choices list grants no writable value. saved metadata survives disconnect.
message BacklightEffectSetting {
  optional BacklightEffect value = 1;
  optional BacklightEffect saved = 2;
  SettingStatus status = 3;
  repeated BacklightEffect choices = 4;
}

message BacklightEffectSettingUpdate {
  // Required. UNKNOWN and unrecognized enum values cannot be saved.
  oneof change {
    BacklightEffect value = 1;
    SettingForget forget = 2;
  }
}

// value may report a mode outside choices. UNKNOWN means an uninterpretable reading.
// choices contains each writable, known enum member at most once and excludes UNKNOWN.
// An empty choices list grants no writable value. saved metadata survives disconnect.
message WheelModeSetting {
  optional WheelMode value = 1;
  optional WheelMode saved = 2;
  SettingStatus status = 3;
  repeated WheelMode choices = 4;
}

message WheelModeSettingUpdate {
  // Required. UNKNOWN and unrecognized enum values cannot be saved.
  oneof change {
    WheelMode value = 1;
    SettingForget forget = 2;
  }
}

// Partial update of KeyboardSettings; units and scope are the same as its fields.
message KeyboardSettingsUpdate {
  KeyboardPlatformSettingUpdate platform = 1;
  FunctionRowModeSettingUpdate function_row = 2;
}

// Partial update of PowerSettings; units and scope are the same as its fields.
message PowerSettingsUpdate {
  IntegerSettingUpdate auto_off = 1;
}

// Partial update of BacklightSettings; units and scope are the same as its fields.
message BacklightSettingsUpdate {
  BoolSettingUpdate enabled = 1;
  BacklightModeSettingUpdate mode = 2;
  IntegerSettingUpdate brightness = 3;
  BacklightDelaySettingsUpdate delay = 4;
  BoolSettingUpdate startup_effect = 5;
  BoolSettingUpdate dial_effect = 6;
  BoolSettingUpdate power_save = 7;
  BacklightEffectSettingUpdate effect = 8;
}

// Partial update of BacklightDelaySettings; units and scope are the same as its fields.
message BacklightDelaySettingsUpdate {
  IntegerSettingUpdate hands_away = 1;
  IntegerSettingUpdate hands_nearby = 2;
  IntegerSettingUpdate external_power = 3;
}

// Partial update of PointerSensorSettings; units and scope are the same as its fields.
message PointerSensorSettingsUpdate {
  // Zero-based physical sensor index. Identifies the sensor; it is never changed.
  uint32 index = 1;
  IntegerSettingUpdate dpi = 2;
}

// Partial update of WheelSettings; units and scope are the same as its fields.
message WheelSettingsUpdate {
  WheelModeSettingUpdate mode = 1;
  IntegerSettingUpdate free_spin_threshold = 2;
  BoolSettingUpdate invert = 3;
}

// Partial update of ThumbwheelSettings; units and scope are the same as its fields.
message ThumbwheelSettingsUpdate {
  BoolSettingUpdate invert = 1;
}

// ---------------------------------------------------------------------------
// Profiles
// ---------------------------------------------------------------------------

// What the Dongle supports for profiles. Profile limits and capabilities are added here as
// fields, never as profile fields on Status.
message ProfileSupport {
  // Supported inputs and outputs, qualified by capability kind and application collection.
  repeated UsageRange ranges = 1;
  // Profile resource usage, at most one entry per type. Missing types are not reported; clients
  // ignore unknown types. MEMORY reports bytes used by loaded profiles and their shared budget
  // in bytes, across connected devices and configuration interfaces. A device whose layers do
  // not fit in the remaining budget loads none of them; see Device.errors. A profile larger than
  // the whole budget cannot be saved.
  // OUTPUTS limits both the outputs one remap can hold and those one held input produces after
  // every layer has applied. LAYERS limits the profiles one ProfileLayers can list, bounding the
  // layers each enabled device keeps in its resident reconnection entry. Both omit count.
  repeated ResourceCapacity resources = 2;
}

// A contiguous range of HID usages on one usage page, in one application collection, for one
// capability kind. The same usage and collection may occur separately under several kinds.
message UsageRange {
  enum Kind {
    // Unknown and unspecified kinds grant no capability.
    KIND_UNSPECIFIED = 0;
    // On/off controls such as keys, buttons and media keys a remap rule can name.
    KIND_REMAP_INPUT = 1;
    // Outputs a remap can produce in the Dongle's USB report for the collection.
    KIND_REMAP_OUTPUT = 2;
    // Relative values such as pointer motion and wheels a scale rule can name.
    KIND_SCALE_INPUT = 3;
    // Absolute Game Pad axes an axis rule can name as inputs.
    KIND_AXIS_INPUT = 4;
    // Absolute Game Pad axes an axis rule can produce in the input's collection.
    KIND_AXIS_OUTPUT = 5;
  }

  // Required. Selects the capability this range grants.
  Kind kind = 1;
  // Required. The HID application collection of the input or output report that carries the
  // range, such as Generic Desktop Mouse or Game Pad.
  Usage collection = 2;
  // Required.
  uint32 usage_page = 3;
  // Inclusive.
  uint32 min = 4;
  // Required. Inclusive.
  uint32 max = 5;
}

// One HID usage.
message Usage {
  // Required.
  uint32 usage_page = 1;
  // Required.
  uint32 usage = 2;
}

// Profiles applied to input in order. Each profile sees the input as the profile before it left it:
// an input another profile remapped arrives as each of its outputs. An empty list passes all input
// through unchanged. A profile that does not exist returns ERROR_CODE_NOT_FOUND. A list exceeding
// the LAYERS limit in ProfileSupport.resources returns ERROR_CODE_BAD_ARGS. A profile may appear
// more than once. A saved reference to a profile that no longer exists is skipped until it is
// changed or the Dongle next starts and removes it.
message ProfileLayers {
  repeated uint32 profiles = 1;
}

// Lists all saved profiles in ascending ID order. Responds with ProfileList.
message ListProfiles {}

// All saved profiles in ascending ID order.
message ProfileList {
  repeated ProfileListEntry entries = 1;
}

message ProfileListEntry {
  // Required.
  oneof entry {
    Profile profile = 1;
    // The ID of a profile whose saved record could not be read from flash. The listing continues
    // past it. An undecodable record is removed as lost and is not listed.
    uint32 unreadable = 2;
  }
}

// Responds with Profile.
message GetProfile {
  // Required.
  uint32 profile = 1;
}

// Creates an empty profile: it passes every input through unchanged. Responds with ProfileCreated
// once saved; a profile event follows. The profile is not used by any device or configuration
// interface.
message CreateProfile {
  // Required. 1..64 UTF-8 bytes without control characters.
  string name = 1;
}

// Copies a profile's rules into a new, independent profile. Responds with ProfileCreated once
// saved; a profile event follows. The copy is not used by any device or configuration
// interface.
message CopyProfile {
  // Required. The source profile.
  uint32 profile = 1;
  // Required. 1..64 UTF-8 bytes without control characters.
  string name = 2;
}

// Deletes a profile with its rules. Responds with no result; profile_removed follows. A profile
// in any saved device's layers, or selected by a configuration interface, enabled or not, returns
// ERROR_CODE_IN_USE.
message DeleteProfile {
  // Required.
  uint32 profile = 1;
}

// The profile CreateProfile or CopyProfile saved.
message ProfileCreated {
  // Required. The new profile's ID.
  uint32 profile = 1;
}

message ProfileRemoved {
  // Required.
  uint32 id = 1;
}

message Profile {
  // Required. Positive. Never reused. Profile IDs are separate from device IDs.
  uint32 id = 1;
  // Required. 1..64 UTF-8 bytes without control characters.
  string name = 2;
  // The kinds of input the profile's rules change, worked out by the Dongle whenever the rules
  // change, so a client can label the profile without reading its rules. A client skips roles it
  // does not know.
  repeated Role roles = 3;
}

// Lists all of the profile's rules, ordered by input usage page, input usage, collection usage
// page, then collection usage. Responds with ProfileRules.
message ListProfileRules {
  // Required.
  uint32 profile = 1;
}

// Saves and forgets rules in one storage write and responds with no result. A saved rule replaces
// the profile's rule for the same input and collection. A rule that remaps the input to only
// itself in the same collection, scales it by a ratio equal to 1, or maps an axis to itself without
// inversion is forgotten instead. Every device using the profile uses the new rules from its next
// input; a held input keeps the outputs it was pressed with until it is released. If any change is invalid or the save
// fails, nothing is saved. A save that would make the profile larger than the
// MEMORY limit in ProfileSupport.resources, or grow a loaded profile beyond the remaining budget,
// returns ERROR_CODE_NO_CAPACITY with CAPACITY_REASON_PROFILE_MEMORY.
//
// The complete Request must fit in 1024 protobuf bytes. Clients divide larger sets of changes
// into separate requests that each fit, waiting for success before sending the next batch. There
// is no fixed rule count per request because encoded sizes vary. Each request saves its changes
// together; separate requests are not one transaction. Earlier successful batches remain saved
// if a later batch fails or the session ends.
message SetProfileRules {
  // Required.
  uint32 profile = 1;
  // Required, at least one. Applied in order; a later change for the same input and collection
  // replaces an earlier one.
  repeated ProfileRuleChange changes = 2;
}

message ProfileRuleChange {
  // Required.
  oneof change {
    // Save this rule.
    ProfileRule rule = 1;
    // Remove the rule for this input, so the input passes through unchanged. Forgetting a rule that
    // does not exist is accepted.
    ProfileRuleRef forget = 2;
  }
}

message ProfileRuleRef {
  // Required.
  Usage input = 1;
  // Required. The input's HID application collection.
  Usage collection = 2;
}

// All of a profile's rules.
message ProfileRules {
  // Required.
  uint32 profile = 1;
  // Ordered by input usage page, input usage, collection usage page, then collection usage.
  repeated ProfileRule rules = 2;
}

// What one input does while the profile is applied. A profile has at most one rule for each
// input usage and application collection together.
message ProfileRule {
  // Required. Within ProfileSupport.ranges of kind KIND_REMAP_INPUT, KIND_SCALE_INPUT or
  // KIND_AXIS_INPUT for the effect, together with collection.
  Usage input = 1;
  // Required. The input's HID application collection. Never inferred from the input usage.
  Usage collection = 2;
  // Required.
  oneof effect {
    Remap remap = 3;
    Scale scale = 4;
    Axis axis = 5;
  }

  // Fixed outputs, all held together for as long as the input is held. No outputs disables the
  // input. A keyboard modifier is an output like any other key. A remap applies when the device
  // reports the input as a held control; other forms of the same usage keep their usual behavior.
  message Remap {
    // Each within ProfileSupport.ranges of kind KIND_REMAP_OUTPUT, at most the
    // OUTPUTS limit in ProfileSupport.resources, each at most once.
    repeated Output outputs = 1;
  }

  message Output {
    // Required.
    Usage usage = 1;
    // The application collection of the Dongle's USB report that carries the output. Missing in a
    // request selects the only report that carries the usage; when several do, it returns
    // ERROR_CODE_BAD_ARGS. The Dongle saves and reports the selected collection.
    Usage collection = 2;
  }

  // Multiplies a relative value by numerator / denominator. A negative numerator inverts it.
  // Scales from several layers multiply into one ratio, applied once. The Dongle keeps the
  // fractional remainder per connection and input, resets it when the ratio changes, and limits a
  // result too large for the USB report to the largest value it carries.
  message Scale {
    // Required. Nonzero.
    sint32 numerator = 1;
    // Required. Positive.
    uint32 denominator = 2;
  }

  // Routes an absolute Game Pad axis to another absolute axis in the same Game Pad application
  // collection. Inversion reverses the normalized axis range. No deadzones, curves or sensitivity.
  message Axis {
    // Required. Within ProfileSupport.ranges of kind KIND_AXIS_OUTPUT for the input's collection.
    Usage destination = 1;
    bool invert = 2;
  }
}

// ---------------------------------------------------------------------------
// Development only. Production firmware answers these with ERROR_CODE_UNKNOWN_COMMAND.
// ---------------------------------------------------------------------------

// Lists all of the device's feature tables, in ascending order of integration, then index within
// the integration's table. Responds with FeatureList.
message ListFeatures {
  // Required.
  uint32 device = 1;
}

// All of a device's features, ordered as ListFeatures.
message FeatureList {
  repeated Feature features = 1;
}

// One entry in a device's feature table, for any integration.
message Feature {
  // Required.
  IntegrationKind integration = 1;
  // The Dongle knows how to use this feature.
  bool supported = 2;
  // The integration's own description of the feature. A client that does not know the variant
  // shows the entry without details.
  oneof detail {
    HidppFeature hidpp = 3;
  }
}

message HidppFeature {
  uint32 index = 1;
  uint32 id = 2;
  uint32 version = 3;
  uint32 flags = 4;
}

// Lists all of a directory's entries, in ascending order of name compared bytewise. Responds with
// FileList.
message ListFiles {
  // Required. Absolute path.
  string path = 1;
}

// All of a directory's entries, ordered as ListFiles.
message FileList {
  repeated FileEntry entries = 1;
}

message FileEntry {
  string name = 1;
  bool directory = 2;
  uint64 size = 3;
}

message ReadFile {
  // Required. Absolute path.
  string path = 1;
}

message FileData {
  bytes data = 1;
}

// ---------------------------------------------------------------------------
// Errors
// ---------------------------------------------------------------------------

message Error {
  ErrorCode code = 1;
  // For ERROR_CODE_NO_CAPACITY.
  CapacityReason reason = 2;
  // For ERROR_CODE_STORAGE_FAILED: the Dongle cannot tell whether the save took effect.
  bool outcome_unknown = 3;
}

enum ErrorCode {
  // A failure this client does not know. Shown as a generic failure.
  ERROR_CODE_UNKNOWN = 0;

  // Request errors.
  ERROR_CODE_BAD_REQUEST = 1;      // The frame is not a Request.
  ERROR_CODE_UNKNOWN_COMMAND = 2;  // No such command in this firmware.
  ERROR_CODE_BAD_ARGS = 3;         // Missing Required field, wrong value type, or out of range.
  ERROR_CODE_TOO_LONG = 4;         // The Request exceeded 1024 protobuf bytes before COBS encoding.
  ERROR_CODE_NOT_READY = 5;        // Bluetooth or storage has not started, or failed to start.
  ERROR_CODE_NOT_FOUND = 6;        // No such device, candidate, profile, setting or file.
  ERROR_CODE_NOT_CONNECTED = 7;    // The command needs a connected device.
  ERROR_CODE_BUSY = 8;             // A pairing is running, or the device is doing something that conflicts.
  ERROR_CODE_DISABLED = 9;
  ERROR_CODE_BLOCKED = 10;
  ERROR_CODE_UNSUPPORTED = 11;     // Transport, interface, setting or value not supported.
  ERROR_CODE_NO_CAPACITY = 12;     // See Error.reason.
  ERROR_CODE_NO_PROMPT = 13;       // AcceptPrompt or RejectPrompt with no open prompt.
  ERROR_CODE_STORAGE_FAILED = 14;  // Reading or writing saved data failed. See Error.outcome_unknown.
  ERROR_CODE_INTERNAL = 15;
  ERROR_CODE_IN_USE = 16;          // A saved preference refers to the profile.

  // Pairing and connection failures.
  ERROR_CODE_CANDIDATE_EXPIRED = 17;
  ERROR_CODE_AUTH_FAILED = 18;
  ERROR_CODE_REJECTED = 19;
  ERROR_CODE_TIMEOUT = 20;
  ERROR_CODE_CANCELLED = 21;
  ERROR_CODE_CONNECTION_FAILED = 22;
  ERROR_CODE_UNSUPPORTED_HID = 23;

  // Integration and setting failures, for any integration. Timeouts use ERROR_CODE_TIMEOUT.
  ERROR_CODE_PROTOCOL_UNSUPPORTED = 24;  // The device lacks a supported protocol version or the reports it needs.
  ERROR_CODE_FEATURE_UNAVAILABLE = 25;   // A feature the integration needs is missing.
  ERROR_CODE_TRANSPORT_ERROR = 26;       // Exchanging messages with the device failed.
  ERROR_CODE_DEVICE_ERROR = 27;          // The device answered with an error.
  ERROR_CODE_INVALID_RESPONSE = 28;      // The device's answer could not be understood.
  ERROR_CODE_READBACK_MISMATCH = 29;     // A written value did not read back.

  // Adapter problems, reported in Status.errors.
  // Storage is ready but has insufficient free space to pair another device, or a deferred save
  // failed for lack of space and has not succeeded yet. Clears when neither condition applies.
  ERROR_CODE_STORAGE_FULL = 30;
  // Loaded profiles use at least 85% of the nonzero profile memory budget.
  ERROR_CODE_PROFILE_MEMORY_LOW = 31;
  // At least one USB interface with priority below 0xC0 cannot fit. The client shows a prominent
  // warning and changes the tray indicator. It also shows the reserved-capacity error if present.
  ERROR_CODE_USB_REQUIRED_CAPACITY_EXCEEDED = 32;
  // At least one USB interface with priority 0xC0 through 0xDF cannot fit. The client shows a
  // subtle indicator independently of the required-capacity error. Omitting unconfigured
  // interfaces at 0xE0 through 0xFE produces neither code; disabled interfaces at 0xFF are excluded.
  ERROR_CODE_USB_RESERVED_CAPACITY_EXCEEDED = 33;

  // Device profile problems, reported in Device.errors. No profiles are loaded for the device
  // while either code applies, so its input passes through unchanged.
  ERROR_CODE_PROFILE_MEMORY_EXCEEDED = 34;  // The profiles do not fit in the remaining memory budget.
  ERROR_CODE_PROFILE_LOAD_FAILED = 35;      // A profile could not be read or decoded.
}

enum CapacityReason {
  CAPACITY_REASON_UNKNOWN = 0;
  // The transport's RESOURCE_TYPE_DEVICES allowance is full.
  CAPACITY_REASON_ENABLED = 1;
  // Flash is full.
  CAPACITY_REASON_STORAGE = 2;
  // ConnectDevice or StartPairing cannot obtain a connection slot. For normal connections this
  // includes the RESOURCE_TYPE_CONNECTIONS allowance; a slot still closing is not available yet.
  CAPACITY_REASON_CONNECTIONS = 3;
  // The profile would exceed the MEMORY limit in ProfileSupport.resources or a loaded profile's
  // growth would exceed the remaining budget.
  CAPACITY_REASON_PROFILE_MEMORY = 4;
}
