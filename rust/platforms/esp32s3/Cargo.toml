[package]
name = "cordial-esp32s3"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace]
resolver = "3"

[features]
default = ["development"]
development = ["cordial-core/development"]
# The development commands under the debug profile, whose version has a -debug suffix.
debug = ["development"]
production = []
btstack = ["dep:cordial-btstack"]
esp-nimble = ["dep:cordial-ble-hid"]
firmware = []

[[bin]]
name = "cordial-esp32s3"
path = "src/main.rs"
required-features = ["firmware"]

[dependencies]
cordial-record-storage = { path = "../../adapters/record-storage" }
embedded-storage-async = "=0.4.2"
cordial-core = { path = "../../crates/cordial-core" }
esp-idf-sys = { version = "=0.38.1", features = ["native"] }
critical-section = "=1.2.0"
embassy-executor = "=0.10.0"
embassy-time = "=0.5.1"
embassy-time-driver = { version = "=0.2.2", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = "=0.3.2"
embassy-usb-driver = "=0.2.2"
embassy-usb-synopsys-otg = "=0.4.0"
cordial-usb = { path = "../../adapters/usb" }
cordial-btstack = { path = "../../adapters/btstack", optional = true, features = ["ffi"] }
cordial-ble-hid = { path = "../../adapters/ble-hid", optional = true }
embassy-sync = "=0.8.0"
embassy-futures = "=0.1.2"

[build-dependencies]
embuild = { version = "=0.33.5", features = ["espidf"] }

[package.metadata.esp-idf-sys]
esp_idf_version = "v6.1"
esp_idf_components = ["main", "platform", "driver", "esp_timer", "esp_driver_gpio", "esp_hw_support", "nvs_flash", "bt", "pthread"]

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/platform"]
bindings_header = "components/platform/platform.h"
bindings_module = "platform"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
