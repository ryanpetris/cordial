[package]
name = "cordial-btstack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
ffi = []
classic = []

[dependencies]
embassy-sync = "=0.8.0"
embassy-futures = "=0.1.2"
cordial-core.workspace = true
heapless = { version = "=0.9.3", default-features = false }

[build-dependencies]
cc = "=1.5.1"

[dev-dependencies]
critical-section = { version = "=1.2.0", features = ["std"] }
cordial-core = { workspace = true, features = ["development"] }
cordial-protocol.workspace = true
prost = { version = "=0.14.4", default-features = false }
