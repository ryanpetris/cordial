[package]
name = "cordial-memory-arm"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
cordial-btstack = { path = "../../adapters/btstack", features = ["ffi", "classic"] }
# The development firmware enables the development commands.
cordial-core = { path = "../../crates/cordial-core", features = ["development"] }
cordial-protocol = { path = "../../crates/cordial-protocol" }
cordial-record-storage = { path = "../../adapters/record-storage" }
cordial-usb = { path = "../../adapters/usb" }
embedded-storage-async = "=0.4.2"
embassy-futures = "=0.1.2"
talc = { version = "=5.1.1", features = ["counters"] }
cortex-m-rt = "=0.7.7"
prost = { version = "=0.14.4", default-features = false }
# The protocol messages use `bytes`, which needs portable-atomic for atomic CAS on thumbv6m.
# The test runs on one core under QEMU.
bytes = { version = "=1.12.1", default-features = false, features = ["extra-platforms"] }
portable-atomic = { version = "=1.15.0", features = ["unsafe-assume-single-core"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
