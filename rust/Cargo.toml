[workspace]
resolver = "3"
members = ["crates/cordial-schema", "crates/cordial-protocol", "crates/cordial-core", "crates/cordial-client", "adapters/record-storage", "adapters/usb", "adapters/btstack", "adapters/ble-hid"]
exclude = ["platforms/pico", "platforms/esp32s3"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

[workspace.dependencies]
cordial-protocol = { path = "crates/cordial-protocol" }
cordial-core = { path = "crates/cordial-core" }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc", "raw_value"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
