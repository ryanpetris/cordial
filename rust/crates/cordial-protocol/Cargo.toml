[package]
name = "cordial-protocol"
description = "Messages, framing and key catalog of the Cordial serial API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Protobuf JSON mapping for logs and command-line output on hosts.
json = ["dep:pbjson", "dep:serde", "dep:pbjson-build"]

[dependencies]
prost = { version = "=0.14.4", default-features = false, features = ["derive"] }
pbjson = { version = "=0.9.0", optional = true }
serde = { workspace = true, optional = true }

[build-dependencies]
prost = "=0.14.4"
prost-build = "=0.14.4"
protox = "=0.9.1"
pbjson-build = { version = "=0.9.0", optional = true }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde"] }
serde = { workspace = true, features = ["std"] }
