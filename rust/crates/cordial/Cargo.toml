[package]
name = "cordial"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cordial-client = { workspace = true, features = ["serialport"] }
cordial-protocol = { workspace = true, features = ["json", "migration"] }
serde_json = { workspace = true, features = ["std"] }
serde.workspace = true
prost = { version = "=0.14.4", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
ctrlc = { version = "=3.5.2", features = ["termination"] }
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }
gtk = { package = "gtk4", version = "=0.11.5", optional = true, features = ["v4_14"] }
adw = { package = "libadwaita", version = "=0.9.2", optional = true, features = ["v1_5"] }
async-channel = { version = "=2.5.0", optional = true }
ksni = { version = "=0.3.7", optional = true, default-features = false, features = ["blocking", "async-io"] }

[features]
default = ["desktop"]
# Headless builds use --no-default-features.
desktop = ["dep:gtk", "dep:adw", "dep:async-channel", "dep:ksni"]

[[bin]]
name = "cordial"
path = "src/main.rs"
