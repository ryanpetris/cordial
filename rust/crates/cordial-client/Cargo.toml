[package]
name = "cordial-client"
description = "Port discovery and connections for the Cordial serial API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["serialport"]
# Discovery and opening of real USB serial ports.
serialport = ["dep:serialport"]

[dependencies]
cordial-protocol.workspace = true
prost = { version = "=0.14.4", default-features = false }
serialport = { version = "=4.10.1", default-features = false, optional = true }
